## ============================================================================
##  World Channel · Codemagic CI/CD
## ============================================================================
##  App web (React + Vite + Tailwind) empacotado como app nativo com Capacitor.
##
##  Fluxo de cada workflow:
##    1. instala dependências        (npm ci)
##    2. gera o bundle web           (npx vite build -> dist/)
##    3. cria/sincroniza a plataforma nativa (npx cap add / npx cap sync)
##    4. compila o binário           (Gradle no Android, Xcode no iOS)
##
##  Para assinar os builds, configure no Codemagic:
##    - Android: grupo de variáveis "keystore_credentials" + integração Keystore
##    - iOS:     integração "App Store Connect" (code signing automático)
## ============================================================================

definitions:
  base_env: &base_env
    node: 20.11.0
    npm: 10

  # `npm ci` exige package-lock.json. Se o lockfile não estiver versionado,
  # cai automaticamente para `npm install` em vez de falhar o build.
  install_deps: &install_deps
    name: Instalar dependências
    script: |
      if [ -f package-lock.json ]; then
        npm ci
      else
        echo "package-lock.json não encontrado — usando npm install."
        npm install
      fi

workflows:
  # ---------------------------------------------------------------------------
  #  WEB — gera o site estático (dist/index.html) para deploy/preview
  # ---------------------------------------------------------------------------
  web-build:
    name: World Channel · Web (Vite)
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      <<: *base_env
    scripts:
      - *install_deps
      - name: Build de produção
        script: npx vite build
    artifacts:
      - dist/**

  # ---------------------------------------------------------------------------
  #  ANDROID — APK + AAB via Capacitor/Gradle
  # ---------------------------------------------------------------------------
  android-build:
    name: World Channel · Android (Capacitor)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      <<: *base_env
      java: 17
      groups:
        # crie este grupo no Codemagic com as chaves de assinatura (opcional)
        - keystore_credentials
      vars:
        PACKAGE_NAME: "com.worldchannel.app"
    scripts:
      - *install_deps

      - name: Build web (Vite)
        script: npx vite build

      - name: Adicionar plataforma Android (se necessário)
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sincronizar Capacitor
        script: npx cap sync android

      - name: Configurar assinatura (se o keystore existir)
        script: |
          if [ -n "$CM_KEYSTORE_PATH" ]; then
            cat >> "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
          else
            echo "Nenhum keystore configurado — gerando build de debug."
          fi

      - name: Compilar APK/AAB
        script: |
          cd android
          chmod +x ./gradlew
          if [ -n "$CM_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease bundleRelease
          else
            ./gradlew assembleDebug
          fi
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - dev@worldchannel.app
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  #  iOS — IPA via Capacitor/Xcode
  # ---------------------------------------------------------------------------
  ios-build:
    name: World Channel · iOS (Capacitor)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *base_env
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.worldchannel.app"
        XCODE_SCHEME: "App"
    scripts:
      - *install_deps

      - name: Build web (Vite)
        script: npx vite build

      - name: Adicionar plataforma iOS (se necessário)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sincronizar Capacitor
        script: npx cap sync ios

      - name: Instalar CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Compilar o app (sem assinatura por padrão)
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
    artifacts:
      - ios/App/build/Build/Products/**/*.app
      - build/ios/ipa/*.ipa
